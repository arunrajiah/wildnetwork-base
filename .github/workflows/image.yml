name: SD card image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Register arm64 emulation (binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Test wnbase
        run: |
          git clone --depth 1 https://github.com/arunrajiah/wdx-agent ../wdx-agent
          python3 -m unittest discover -s tests

      - name: Build image
        run: WN_PRUNE_WORK=1 ./image/build.sh

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: wildnetwork-base-image
          path: |
            image/deploy/*.img.xz
            image/deploy/*.info
          compression-level: 0
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: image/deploy/*.img.xz
