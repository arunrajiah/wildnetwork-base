name: SD card image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The update file each Base downloads by itself (wnupdate.py): the repository at the tag, with its sha256. A job of
  # its own, so it is on the release within a minute instead of after the image build.
  update-file:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make the update file
        run: |
          ver="${GITHUB_REF_NAME#v}"
          grep -qx "VERSION = \"$ver\"" base/wnbase.py || { echo "Tag $GITHUB_REF_NAME does not match VERSION in base/wnbase.py"; exit 1; }
          git archive --format=tar.gz --prefix="wildnetwork-base-$ver/" -o "wnbase-$ver.tar.gz" HEAD
          sha256sum "wnbase-$ver.tar.gz" > "wnbase-$ver.tar.gz.sha256"
          cat "wnbase-$ver.tar.gz.sha256"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wnbase-*.tar.gz
            wnbase-*.tar.gz.sha256

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Register arm64 emulation (binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Test wnbase
        run: |
          git clone --depth 1 https://github.com/arunrajiah/wdx-agent ../wdx-agent
          python3 -m unittest discover -s tests

      - name: Build image
        run: WN_PRUNE_WORK=1 ./image/build.sh

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: wildnetwork-base-image
          path: |
            image/deploy/*.img.xz
            image/deploy/*.img.xz.sha256
            image/deploy/*.info
          compression-level: 0
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            image/deploy/*.img.xz
            image/deploy/*.img.xz.sha256
